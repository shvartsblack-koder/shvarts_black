name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Frontend talks to Base44 cloud API (GitHub Pages has no /api proxy)
          VITE_BASE44_APP_ID: 6a7cf89663ffa8e0d4ea7f6d
          VITE_BASE44_APP_BASE_URL: https://shvarts.black
          VITE_BASE44_SERVER_URL: https://base44.app

      - name: Copy CNAME to dist
        run: |
          cp CNAME dist/CNAME
          # GitHub Pages SPA fallback: unknown routes serve index
          cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
